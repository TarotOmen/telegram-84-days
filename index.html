<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>твои 12 недель. 84 дня к цели</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#0d0e10;--card:#17191d;--line:#2b2e34;--text:#f3f4f6;--muted:#969ba5;--accent:#43d17a;--danger:#ff5d68;--orange:#ffad32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.title{font-size:22px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}.status{font-size:12px;color:var(--muted);text-align:right}.status.ok{color:var(--accent)}.status.bad{color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:var(--muted);line-height:1.45}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#0f1012;color:var(--text);border-radius:12px;padding:12px;outline:none}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{border-color:#59616d}.row{display:flex;gap:8px}.row>*{flex:1}.btn{padding:12px 14px;border-radius:12px;background:#252931;color:#fff;cursor:pointer}.btn.primary{background:var(--accent);color:#07130c;font-weight:800}.btn.danger{background:#3a1d21;color:#ff9da4}.hidden{display:none!important}.weeks{display:grid;gap:12px}.week{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.weekHead{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.weekHead strong{font-size:16px}.weekGoal{font-size:12px;color:var(--muted);margin-top:3px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:10px}.day{min-width:0;aspect-ratio:1;border:1px solid var(--line);background:#101114;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.day small{color:var(--muted);font-size:10px}.day.done{border-color:var(--accent)}.day.bad{border-color:var(--danger)}.day.zero{border-color:var(--orange)}.day.future{opacity:.75}.lock{opacity:.48}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#252931;color:var(--muted);font-size:11px}.modalBack{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:20}.modal{width:100%;max-width:760px;margin:auto;background:#17191d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.modalTop{display:flex;justify-content:space-between;align-items:center}.x{width:38px;height:38px;border-radius:50%;background:#292c33;color:#fff;font-size:20px}.eff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.eff button{padding:13px;border-radius:12px;background:#252931;color:#fff}.eff button.sel.yes{background:#14572f}.eff button.sel.no{background:#61252b}.eff button.sel.zero{background:#714d14}.noteInfo{font-size:12px;color:var(--muted);margin-top:7px}@media(min-width:600px){.modal{border-radius:22px;margin:20px auto}.days{gap:9px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">твои 12 недель</div><div class="sub">84 дня к цели</div></div><div id="status" class="status">подключение…</div></div>
<section id="onboard" class="card hero"><h1>Начни свой цикл</h1><p>Одна главная цель. 12 недель. Каждый день фиксируй, что сделал.</p><label>Главная цель *</label><input id="goal" placeholder="Чего хочешь добиться?"><label>Что конкретно будешь делать?</label><input id="goalAction" placeholder="Твое ежедневное действие"><label>Вторая цель</label><input id="goal2" placeholder="Необязательно"><label>Действие по второй цели</label><input id="goal2Action" placeholder="Необязательно"><label>Третья цель</label><input id="goal3" placeholder="Необязательно"><label>Действие по третьей цели</label><input id="goal3Action" placeholder="Необязательно"><label>Начать с</label><input id="start" type="date"><button id="startBtn" class="btn primary" style="width:100%;margin-top:14px">Начать 12 недель</button></section>
<section id="app" class="hidden"><div class="card"><div style="font-size:18px;font-weight:800" id="goalTitle"></div><div class="sub" id="goalActionView"></div><div class="row" style="margin-top:12px"><button id="editGoal" class="btn">Цели</button><button id="reset" class="btn danger">Сбросить цикл</button></div></div><div id="weeks" class="weeks"></div></section></div>
<div id="modalBack" class="modalBack hidden"><div class="modal"><div class="modalTop"><div><strong id="dayTitle"></strong><div id="dayDate" class="sub"></div></div><button id="close" class="x">×</button></div><label>Цель на этот день</label><input id="dayGoal" placeholder="Что должно быть сделано сегодня?"><label>Что сделал</label><textarea id="note" placeholder="Запиши результат…"></textarea><div class="noteInfo">Оценка доступна после записи результата.</div><div class="eff"><button data-eff="yes">✅ Сделал</button><button data-eff="no">❌ Не сделал</button><button data-eff="zero">0️⃣ Ничего</button></div></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API="https://telegram-84-days-api.onrender.com";const $=id=>document.getElementById(id);const iso=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};let data=null,paid=false,sessionReady=false,selected=null,saveChain=Promise.resolve();
function setStatus(t,k=""){$("status").textContent=t;$("status").className="status "+k}function localLoad(){try{return JSON.parse(localStorage.getItem("84days")||"null")}catch{return null}}function localSave(){try{if(data)localStorage.setItem("84days",JSON.stringify(data))}catch{}}
async function postState(){if(!sessionReady||!tg?.initData||!data)return false;const snapshot=JSON.parse(JSON.stringify(data));setStatus("сохраняю…");const r=await fetch(API+"/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,state:snapshot})});const j=await r.json();if(!j?.ok)throw new Error(j?.error||"save failed");if(typeof j.paid==="boolean")paid=j.paid;setStatus("сохранено","ok");return true}
function save(){localSave();saveChain=saveChain.then(()=>postState()).catch(e=>{console.warn(e);setStatus("локально сохранено","bad");return false});return saveChain}
function normaliseState(s){if(!s)return null;s.notes=s.notes||{};s.weekGoals=s.weekGoals||{};s.weekReviews=s.weekReviews||{};s.goals=s.goals||{main:{title:s.goal||"",action:""},second:{title:"",action:""},third:{title:"",action:""}};return s}
async function init(){setStatus("подключение…");const local=normaliseState(localLoad());if(!tg?.initData){data=local;finish();return}try{const r=await fetch(API+"/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const j=await r.json();if(!j?.ok)throw new Error(j?.error||"session failed");paid=j.paid===true;sessionReady=true;const server=normaliseState(j.state&&j.state.goal&&j.state.start?j.state:null);if(server){data=server;localSave()}else if(local&&local.goal&&local.start){data=local;await postState()}else data=null;finish()}catch(e){console.warn(e);sessionReady=false;data=local;finish();setStatus(data?"офлайн: локальная копия":"нет соединения","bad")}}
function finish(){if(data){data=normaliseState(data);prepareFormFromData();render()}else{$("onboard").classList.remove("hidden");$("app").classList.add("hidden");$("start").value=iso(new Date());setStatus(sessionReady?"готово":"локально","ok")}}
function prepareFormFromData(){$("onboard").classList.add("hidden");$("app").classList.remove("hidden");$("goal").value=data.goal||"";$("goalAction").value=data.goals?.main?.action||"";$("goal2").value=data.goals?.second?.title||"";$("goal2Action").value=data.goals?.second?.action||"";$("goal3").value=data.goals?.third?.title||"";$("goal3Action").value=data.goals?.third?.action||"";$("start").value=data.start||""}
$("startBtn").onclick=async()=>{const g=$("goal").value.trim();if(!g)return alert("Напиши главную цель");data={goal:g,start:$("start").value||iso(new Date()),notes:{},weekGoals:{},weekReviews:{},goals:{main:{title:g,action:$("goalAction").value.trim()},second:{title:$("goal2").value.trim(),action:$("goal2Action").value.trim()},third:{title:$("goal3").value.trim(),action:$("goal3Action").value.trim()}}};localSave();render();await save()};
$("editGoal").onclick=()=>{$("onboard").classList.remove("hidden");$("app").classList.add("hidden")};$("reset").onclick=()=>{if(!confirm("Удалить текущий цикл?"))return;data=null;localStorage.removeItem("84days");location.reload()};
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){if(!data)return;$("goalTitle").textContent=data.goal||"";$("goalActionView").textContent=data.goals?.main?.action||"";const w=$("weeks");w.innerHTML="";const today=iso(new Date());for(let week=1;week<=12;week++){const box=document.createElement("section");box.className="week";const h=document.createElement("div");h.className="weekHead";const wg=data.weekGoals?.[week]||"";h.innerHTML="<div><strong>Неделя "+week+"</strong><div class='weekGoal'>"+esc(wg||"Цель недели не задана")+"</div></div><span class='pill'>"+(week*7)+"/84</span>";box.appendChild(h);const days=document.createElement("div");days.className="days";for(let i=0;i<7;i++){const n=(week-1)*7+i,k=addDays(data.start,n),note=data.notes?.[k]||{};const b=document.createElement("button");b.className="day"+(k>today?" future":"");if(note.efficiency==="yes")b.classList.add("done");if(note.efficiency==="no")b.classList.add("bad");if(note.efficiency==="zero")b.classList.add("zero");b.innerHTML="<strong>"+(n+1)+"</strong><small>"+k.slice(8,10)+"."+k.slice(5,7)+"</small>";if(!paid&&week>1){b.innerHTML="<strong>🔒</strong><small>день "+(n+1)+"</small>";b.disabled=true}else b.onclick=()=>openDay(k,n);days.appendChild(b)}box.appendChild(days);w.appendChild(box)}}
function openDay(k,n){selected=k;$("dayTitle").textContent="День "+(n+1);$("dayDate").textContent=k;const note=data.notes?.[k]||{};$("dayGoal").value=note.dayGoal||"";$("note").value=note.text||"";document.querySelectorAll(".eff button").forEach(b=>b.classList.toggle("sel",b.dataset.eff===note.efficiency));$("modalBack").classList.remove("hidden")}
function saveDayDraft(){if(!selected||!data)return;const t=$("note").value.trim(),eff=t?(document.querySelector(".eff button.sel")?.dataset.eff||""):"";data.notes[selected]={...(data.notes[selected]||{}),dayGoal:$("dayGoal").value.trim(),text:t,result:!!t,efficiency:eff};save()}
$("note").addEventListener("input",saveDayDraft);$("dayGoal").addEventListener("input",saveDayDraft);document.querySelectorAll(".eff button").forEach(b=>b.onclick=()=>{if(!$("note").value.trim())return;document.querySelectorAll(".eff button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");saveDayDraft();render()});$("close").onclick=()=>{$("modalBack").classList.add("hidden");render()};$("modalBack").onclick=e=>{if(e.target===$("modalBack"))$("close").click()};init();
</script></body></html>
